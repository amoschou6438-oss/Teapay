<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>茶會帳本</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --paper:#EAE1C8;
    --paper-card:#F7F1DF;
    --paper-card-2:#F1E9D2;
    --ink:#2B2820;
    --ink-soft:#6B6350;
    --ink-faint:#A69C82;
    --tea:#425A3B;
    --tea-deep:#2E4029;
    --seal:#A5372C;
    --seal-deep:#7E2A21;
    --gold:#AD8B3F;
    --rule:rgba(43,40,32,0.14);
  }

  *{box-sizing:border-box;}
  #tea-ledger-root{
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(90deg, rgba(43,40,32,0.035) 0 1px, transparent 1px 96px),
      var(--paper);
    min-height:100%;
    padding:28px 18px 60px;
    -webkit-font-smoothing:antialiased;
  }
  #tea-ledger-root *{box-sizing:border-box;}

  .wrap{max-width:720px;margin:0 auto;}

  /* Header */
  .hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .hdr h1{
    font-family:'Noto Serif TC',serif;font-weight:900;font-size:30px;
    margin:0 0 4px;letter-spacing:2px;color:var(--tea-deep);
  }
  .hdr p{margin:0;color:var(--ink-soft);font-size:13px;letter-spacing:1px;}

  .hdr-logo{
    flex:0 0 auto;width:110px;height:110px;border-radius:50%;
    object-fit:cover;box-shadow:0 0 0 2px var(--rule);
  }

  .hdr-logo-row{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0;}
  .hdr .hdr-caption{
    margin:0;color:var(--tea-deep);font-size:26px;line-height:1.15;letter-spacing:1px;
    font-family:'Noto Sans TC',sans-serif;font-weight:900;
    white-space:normal;
  }

  .seal{
    flex:0 0 auto;width:76px;height:76px;border-radius:50%;
    border:3px solid var(--seal);color:var(--seal);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Noto Serif TC',serif;font-weight:900;
    transform:rotate(-6deg);
    box-shadow:0 0 0 3px rgba(165,55,44,0.08);
    line-height:1.1;
  }
  .seal .lbl{font-size:11px;letter-spacing:2px;margin-bottom:2px;}
  .seal .num{font-size:16px;letter-spacing:0.5px;}
  .seal .num.alert-text{font-size:12px;line-height:1.35;letter-spacing:0.5px;padding:0 6px;}

  /* Stats strip */
  .stats{display:none;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:22px;}
  .stat{
    background:var(--paper-card);border:1px solid var(--rule);border-radius:10px;
    padding:12px 10px;text-align:center;
  }
  .stat .k{font-size:11px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:4px;}
  .stat .v{font-family:'Noto Serif TC',serif;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;}
  .stat.income .v{color:var(--tea-deep);}
  .stat.expense .v{color:var(--seal-deep);}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--rule);}
  .tab{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;
    padding:9px 16px;cursor:pointer;color:var(--ink-soft);
    border-bottom:2px solid transparent;margin-bottom:-2px;letter-spacing:1px;
    background:none;border-top:none;border-left:none;border-right:none;
  }
  .tab.active{color:var(--tea-deep);border-bottom-color:var(--seal);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* Screens (主畫面 / 收支明細 / 成員名單 各自獨立一個畫面) */
  .screen{display:none;}
  .screen.active{display:block;}
  .screen-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .screen-hdr h2{
    font-family:'Noto Serif TC',serif;font-weight:900;font-size:20px;margin:0;
    color:var(--tea-deep);letter-spacing:1px;
  }
  .btn-back{
    font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:13px;
    background:transparent;border:1px solid var(--rule);color:var(--ink-soft);
    border-radius:8px;padding:7px 12px;cursor:pointer;letter-spacing:0.5px;flex:0 0 auto;
  }
  .btn-back:hover{opacity:0.8;background:var(--paper-card);}

  /* 右下角 🏠：取代各畫面標題列的「← 返回主畫面」；可按住拖曳移動，位置會記住 */
  .home-fab{
    display:none;position:fixed;right:20px;bottom:24px;width:56px;height:56px;z-index:40;
  }
  .home-fab.show{display:block;}
  .home-fab-btn{
    position:absolute;inset:0;width:56px;height:56px;border-radius:50%;
    background:var(--paper-card);border:3px solid var(--gold);color:var(--ink);
    font-size:26px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 6px 18px rgba(43,40,32,0.3);transition:transform .15s ease;
  }
  .home-fab-btn:hover{background:var(--paper-card-2);}
  .home-fab-btn:active{transform:scale(0.94);}
  .home-fab.fm-dragging .home-fab-btn{cursor:grabbing;transition:none;transform:scale(1.1);box-shadow:0 10px 26px rgba(43,40,32,0.4);}
  .home-fab-img{width:36px;height:36px;object-fit:contain;pointer-events:none;-webkit-user-drag:none;}
  .fm-label{
    position:absolute;top:50%;right:calc(100% + 10px);transform:translateY(-50%);
    background:var(--tea-deep);color:#F7F1DF;font:700 13px/1 'Noto Sans TC',sans-serif;letter-spacing:0.5px;
    padding:6px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .home-fab.fm-label-right .fm-label{right:auto;left:calc(100% + 10px);}

  .nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;margin-bottom:18px;}
  .nav-card{
    font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:30px;
    background:var(--paper-card);border:1px solid var(--rule);border-radius:12px;
    padding:20px 12px;cursor:pointer;color:var(--tea-deep);letter-spacing:1px;
    display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
    transition:opacity .15s;
  }
  .nav-card .nav-icon{font-size:52px;}
  .nav-card .nav-sub{font-family:'Noto Sans TC',sans-serif;font-weight:400;font-size:11px;color:var(--ink-soft);letter-spacing:0.5px;}
  .nav-card:hover{opacity:0.85;}

  /* 主畫面：橫條資訊圖表樣式（白色圓角橫條＋彩色底板，左右交錯） */
  .bar-list{display:flex;flex-direction:column;gap:2px;width:100%;max-width:640px;margin:0 auto 18px;}
  .bar{
    --c:#C3408E;--ct:#A3336F;
    position:relative;display:block;width:100%;margin:0;padding:16px 0;
    background:none;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:transform .15s ease;
  }
  .bar:nth-child(4n+2){--c:#56C4C5;--ct:#2C9597;}
  .bar:nth-child(4n+3){--c:#FBAA1B;--ct:#C27A00;}
  .bar:nth-child(4n+4){--c:#089CC0;--ct:#06788F;}
  .bar:active{transform:scale(.985);}
  .bar:focus-visible{outline:3px solid var(--c);outline-offset:2px;border-radius:26px;}

  .bar-back{
    position:absolute;top:0;bottom:0;right:0;width:58%;background:var(--c);
    border-radius:0 28px 28px 0;clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);
    box-shadow:inset -16px 0 18px -12px rgba(0,0,0,.22);
  }
  .bar-card{
    position:relative;z-index:1;display:flex;align-items:center;
    width:95.5%;min-height:100px;padding:14px 16px 14px 10px;
    background:#fff;border-radius:22px;
    box-shadow:0 10px 16px -6px rgba(0,0,0,.28),6px 4px 14px rgba(0,0,0,.12);
  }
  .bar-card::before,.bar-card::after{
    content:"";position:absolute;width:16%;height:26px;background:var(--c);pointer-events:none;
  }
  .bar-card::before{top:0;left:0;border-radius:22px 0 20px 0;}
  .bar-card::after{bottom:0;right:0;border-radius:20px 0 22px 0;}

  .bar:nth-child(even) .bar-back{
    right:auto;left:0;border-radius:28px 0 0 28px;clip-path:polygon(0 0,78% 0,100% 100%,0 100%);
    box-shadow:inset 16px 0 18px -12px rgba(0,0,0,.22);
  }
  .bar:nth-child(even) .bar-card{margin-left:auto;box-shadow:0 10px 16px -6px rgba(0,0,0,.28),-6px 4px 14px rgba(0,0,0,.12);}
  .bar:nth-child(even) .bar-card::before{left:auto;right:0;border-radius:0 22px 0 20px;}
  .bar:nth-child(even) .bar-card::after{right:auto;left:0;border-radius:0 20px 0 22px;}

  .bar-no{
    flex:0 0 auto;width:54px;text-align:center;font-family:'Noto Sans TC',sans-serif;
    font-weight:900;font-size:30px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums;
  }
  .bar-line{flex:0 0 auto;align-self:stretch;width:2px;margin:4px 12px 4px 6px;background:var(--c);}
  .bar-ico{flex:0 0 auto;width:42px;height:42px;margin-right:14px;color:var(--c);}
  .bar-ico svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;}
  .bar-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .bar-txt b{font-size:18px;font-weight:900;line-height:1.2;letter-spacing:.5px;color:var(--c);}
  .bar-txt small{font-size:12.5px;line-height:1.5;font-weight:400;color:var(--ct);}
  @media (max-width:359px){
    .bar-no{width:44px;font-size:26px;}
    .bar-ico{width:34px;height:34px;margin-right:10px;}
    .bar-line{margin-right:8px;}
  }
  @media (min-width:520px){
    .bar-list{max-width:720px;}
    .bar-card{min-height:118px;padding:18px 28px 18px 14px;}
    .bar-no{width:72px;font-size:38px;}
    .bar-line{margin:4px 18px 4px 10px;}
    .bar-ico{width:52px;height:52px;margin-right:20px;}
    .bar-txt b{font-size:22px;}
    .bar-txt small{font-size:14px;}
  }

  /* Toolbar */
  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .btn{
    font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:13px;
    border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid transparent;
    letter-spacing:0.5px;transition:opacity .15s;
  }
  .btn:hover{opacity:0.85;}
  .btn-income{background:var(--tea);color:#F7F1DF;}
  .btn-expense{background:var(--seal);color:#F7F1DF;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--rule);}
  .btn-cancel{background:transparent;color:var(--ink-soft);border-color:var(--rule);}
  .btn-save{background:var(--tea-deep);color:#F7F1DF;}
  .btn-small{padding:5px 10px;font-size:12px;border-radius:6px;}

  /* Form card */
  .form-card{
    background:var(--paper-card);border:1px solid var(--rule);border-radius:12px;
    padding:16px;margin-bottom:18px;display:none;
  }
  .form-card.open{display:block;}
  .form-card h3{margin:0 0 12px;font-family:'Noto Serif TC',serif;font-size:16px;color:var(--tea-deep);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:0.5px;}
  .field input[type=date], .field input[type=number], .field input[type=text], .field textarea{
    width:100%;max-width:100%;min-width:0;box-sizing:border-box;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;
    background:#fff;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--ink);
  }
  .field input[type=date]{
    -webkit-appearance:none;appearance:none;display:block;
  }
  .field input[type=date]::-webkit-date-and-time-value{
    text-align:left;
  }
  .field textarea{resize:vertical;min-height:44px;}

  .member-amounts{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .member-amount-row{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px dashed var(--rule);}
  .member-amount-row:last-child{border-bottom:none;}
  .member-amount-row .row-top{display:flex;align-items:center;gap:8px;}
  .member-amount-row .name{width:56px;flex:0 0 auto;font-size:13px;color:var(--ink);}
  .member-amount-row input.amt-input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;font-size:13px;}
  .member-amount-row .stepper{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;}
  .step-btn{
    font-family:'Noto Sans TC',sans-serif;font-size:10px;line-height:1;padding:4px 9px;border-radius:4px;
    border:1px solid var(--rule);background:#fff;color:var(--ink-soft);cursor:pointer;
  }
  .step-btn:hover{opacity:0.8;background:var(--paper-card-2);}
  .step-btn:active{opacity:0.65;}
  .member-amount-row input.period-input{
    width:100%;padding:6px 9px;border:1px solid var(--rule);border-radius:6px;
    font-size:12px;color:var(--ink-soft);background:#fff;
  }
  .no-members-hint{font-size:12px;color:var(--ink-faint);padding:6px 0;}

  .donation-inline{
    display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);
    white-space:nowrap;flex:0 0 auto;cursor:pointer;user-select:none;
  }
  .donation-inline input[type=checkbox]{width:14px;height:14px;accent-color:var(--seal);cursor:pointer;margin:0;}

  .other-row{margin-top:2px;border-top:1px solid var(--rule);padding-top:10px;}
  .other-row .name{color:var(--ink-soft);}

  .checkbox-field{margin-top:2px;}
  .checkbox-label{
    display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;
    padding:8px 0;
  }
  .checkbox-label input[type=checkbox]{width:17px;height:17px;accent-color:var(--seal);cursor:pointer;flex:0 0 auto;}

  .donation-row{display:flex;gap:8px;}
  .donation-row input[type=number]{flex:0 0 100px;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;background:#fff;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--ink);}
  .donation-row input[type=text]{flex:1;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;background:#fff;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--ink);}

  .form-total{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-top:1px dashed var(--rule);margin-bottom:12px;
    font-family:'Noto Serif TC',serif;font-weight:700;
  }
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}
  .form-msg{
    color:var(--seal-deep);font-size:12px;padding:8px 10px;margin-bottom:12px;
    background:rgba(165,55,44,0.08);border:1px solid rgba(165,55,44,0.2);border-radius:7px;
    display:none;
  }

  #tea-toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:#F7F1DF;font-size:13px;padding:10px 18px;border-radius:20px;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    z-index:50;max-width:90%;text-align:center;
  }
  #tea-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Record list */
  .record{
    display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;
    padding:14px 4px;border-bottom:1px solid var(--rule);align-items:start;
  }
  .record:last-child{border-bottom:none;}
  .record .date-cell{grid-column:1;grid-row:1;position:relative;width:26px;height:108px;margin:0 auto;}
  .record .date-input{
    position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;
    opacity:0;cursor:pointer;
  }
  .record .date-label{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--ink-soft);white-space:nowrap;pointer-events:none;
    border:1px dashed var(--rule);background:transparent;border-radius:4px;
    font-family:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;
    writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:1px;
  }
  .record .date-cell:hover .date-label{border-color:var(--tea);background:#fff;}
  .record .date-input:focus + .date-label{outline:none;border-color:var(--tea);background:#fff;}
  .record .tag{
    grid-column:1;grid-row:2;font-size:11px;padding:0;border-radius:20px;
    display:block;margin-top:6px;font-weight:700;letter-spacing:2px;
    writing-mode:vertical-rl;text-orientation:upright;width:22px;height:46px;line-height:1.4;
    text-align:center;margin-left:auto;margin-right:auto;
    font-family:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  .tag.income{background:rgba(66,90,59,0.14);color:var(--tea-deep);}
  .tag.expense{background:rgba(165,55,44,0.12);color:var(--seal-deep);}
  .record .note{grid-column:2;grid-row:1/3;font-size:13px;color:var(--ink);line-height:1.55;white-space:pre-wrap;padding-top:1px;}
  .record .note .note-seg{white-space:nowrap;}
  .record .amt{
    grid-column:3;grid-row:1;font-family:'Noto Serif TC',serif;font-weight:700;
    font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;
  }
  .amt.income{color:var(--tea-deep);}
  .amt.expense{color:var(--seal-deep);}
  .record .bal{grid-column:3;grid-row:2;font-size:11px;color:var(--ink-faint);text-align:right;font-variant-numeric:tabular-nums;}
  .record .actions{grid-column:3;grid-row:3;display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:2px;}
  .record .del{
    background:none;border:none;color:var(--ink-faint);
    font-size:11px;cursor:pointer;padding:2px 4px;
  }
  .record .del:hover{color:var(--seal);}
  .record .line-report{
    background:none;border:none;color:var(--tea-deep);font-weight:700;
    font-size:11px;cursor:pointer;padding:2px 4px;letter-spacing:0.5px;
  }
  .record .line-report:hover{color:#06C755;}
  .record .edit-btn{
    background:none;border:none;color:var(--gold);font-weight:700;
    font-size:11px;cursor:pointer;padding:2px 4px;letter-spacing:0.5px;
  }
  .record .edit-btn:hover{color:var(--tea-deep);}

  .empty{text-align:center;color:var(--ink-faint);padding:40px 10px;font-size:14px;}

  /* Members panel */
  .add-member{display:flex;gap:8px;margin-bottom:18px;}
  .add-member input{flex:1;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px;background:#fff;}
  .member-list{display:flex;flex-wrap:wrap;gap:8px;}
  .member-chip{
    display:flex;align-items:center;gap:8px;background:var(--paper-card);
    border:1px solid var(--rule);border-radius:20px;padding:7px 8px 7px 14px;font-size:14px;
  }
  .member-chip button{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;
    width:18px;height:18px;line-height:1;border-radius:50%;font-size:13px;
  }
  .member-chip button:hover{color:var(--seal);background:rgba(165,55,44,0.1);}

  .hint{font-size:12px;color:var(--ink-faint);margin-top:14px;line-height:1.6;}
  .loading{text-align:center;padding:60px 0;color:var(--ink-faint);}

  /* ===== 其他畫面：沿用主畫面橫條風格（灰底、白色圓角卡片、彩色底板與角塊） ===== */
  #tea-ledger-root{background:#E2E2E2;}
  #tea-ledger-root .hdr .hdr-caption{color:#2B2B2B;}
  .home-fab-btn{border-color:#C3408E;background:#fff;}
  .fm-label{background:#C3408E;}

  #screen-income{--c:#C3408E;--ct:#A3336F;--cl:#EBC4DC;}
  #screen-expense{--c:#56C4C5;--ct:#2C9597;--cl:#BDE5E6;}
  #screen-records{--c:#FBAA1B;--ct:#C27A00;--cl:#FDDDA0;}
  #screen-members{--c:#56C4C5;--ct:#2C9597;--cl:#BDE5E6;}

  /* 標題列＝一條白色橫條 */
  .screen-hdr{
    position:relative;width:95.5%;margin:0 0 4px;padding:34px 22px 30px;
    background:#fff;border-radius:22px;
    box-shadow:0 10px 16px -6px rgba(0,0,0,.28),6px 4px 14px rgba(0,0,0,.12);
  }
  .screen-hdr h2{
    font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:22px;letter-spacing:1px;
    color:var(--c);padding-left:14px;border-left:3px solid var(--c);line-height:1.2;
  }
  #screen-expense .screen-hdr,#screen-members .screen-hdr{margin-left:auto;box-shadow:0 10px 16px -6px rgba(0,0,0,.28),-6px 4px 14px rgba(0,0,0,.12);}

  /* 內容卡片：彩色底板 + 白色卡片 */
  .pcard{position:relative;padding:16px 0;margin-bottom:12px;}
  .pcard.rev>.bar-back{
    right:auto;left:0;border-radius:28px 0 0 28px;clip-path:polygon(0 0,78% 0,100% 100%,0 100%);
    box-shadow:inset 16px 0 18px -12px rgba(0,0,0,.22);
  }
  .pcard>.pcard-in,.pcard>.form-card{
    position:relative;z-index:1;width:95.5%;margin:0;padding:34px 18px;
    background:#fff;border:0;border-radius:22px;
    box-shadow:0 10px 16px -6px rgba(0,0,0,.28),6px 4px 14px rgba(0,0,0,.12);
  }
  .pcard.rev>.pcard-in,.pcard.rev>.form-card{margin-left:auto;box-shadow:0 10px 16px -6px rgba(0,0,0,.28),-6px 4px 14px rgba(0,0,0,.12);}

  /* 彩色角塊 */
  .screen-hdr::before,.screen-hdr::after,.pcard>.pcard-in::before,.pcard>.pcard-in::after,.pcard>.form-card::before,.pcard>.form-card::after{
    content:"";position:absolute;width:16%;height:26px;background:var(--c);pointer-events:none;
  }
  .screen-hdr::before,.pcard>.pcard-in::before,.pcard>.form-card::before{top:0;left:0;border-radius:22px 0 20px 0;}
  .screen-hdr::after,.pcard>.pcard-in::after,.pcard>.form-card::after{bottom:0;right:0;border-radius:20px 0 22px 0;}
  #screen-expense .screen-hdr::before,#screen-members .screen-hdr::before,
  .pcard.rev>.pcard-in::before,.pcard.rev>.form-card::before{left:auto;right:0;border-radius:0 22px 0 20px;}
  #screen-expense .screen-hdr::after,#screen-members .screen-hdr::after,
  .pcard.rev>.pcard-in::after,.pcard.rev>.form-card::after{right:auto;left:0;border-radius:0 20px 0 22px;}

  /* 表單元件 */
  .pcard .field label{color:var(--ct);font-weight:700;}
  #tea-ledger-root .pcard input:not([type=checkbox]),#tea-ledger-root .pcard textarea{
    border:1.5px solid var(--cl);border-radius:12px;background:#fff;
  }
  #tea-ledger-root .pcard input:not([type=checkbox]):focus,#tea-ledger-root .pcard textarea:focus{outline:none;border-color:var(--c);}
  .pcard input[type=checkbox]{accent-color:var(--c);}
  .pcard .member-amount-row{border-bottom:1.5px dashed var(--cl);}
  .pcard .member-amount-row .name{font-weight:700;}
  .pcard .other-row{border-top:2px solid var(--cl);}
  .pcard .step-btn{border:1.5px solid var(--cl);color:var(--ct);border-radius:6px;}
  .pcard .form-total{border-top:2px solid var(--cl);color:var(--ct);font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:17px;}
  .pcard .btn{border-radius:12px;padding:10px 20px;}
  .pcard .btn-save,.pcard .btn-income{background:var(--ct);color:#fff;}
  .pcard .btn-cancel{background:#fff;border:1.5px solid var(--cl);color:var(--ct);}

  /* 收支明細 */
  .pcard .record{border-bottom:2px solid var(--cl);}
  .pcard .record:last-child{border-bottom:none;}
  .tag.income{background:#F8E0EE;color:#A3336F;}
  .tag.expense{background:#D3EFF0;color:#1F7C7E;}
  .amt.income{color:#A3336F;}
  .amt.expense{color:#2C9597;}
  .pcard .record .date-label{border-color:var(--cl);}
  .pcard .record .line-report{color:var(--ct);}
  .pcard .record .edit-btn{color:var(--gold);}

  /* 成員名單 */
  .pcard .member-chip{background:#E4F5F6;border:1.5px solid var(--cl);border-radius:999px;}
  .pcard .member-chip button:hover{color:#A3336F;background:rgba(195,64,142,.12);}
</style>

    <!-- ============ 新增收入 畫面 ============ -->
    <div class="screen" id="screen-income">
      <div class="screen-hdr">
        <h2 id="income-screen-title">新增收入</h2>
      </div>
      <div class="pcard"><span class="bar-back"></span>
      <div class="form-card open" id="form-income">
        <div class="field">
          <label>日期</label>
          <input type="date" id="income-date">
        </div>
        <label style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.5px;">各成員金額（留空表示未繳）</label>
        <div class="member-amounts" id="income-member-rows"></div>

          <label>其他項目（選填，可輸入金額與備註）</label>
          <div class="donation-row">
            <input type="number" id="income-other-amount" min="0" placeholder="金額">

          </div>
        </div>
        <div class="field">
          <label>備註（選填）</label>
          <textarea id="income-note" placeholder="例如：了願、佈施說明…"></textarea>
        </div>
        <div class="form-total">
          <span>合計</span>
          <span id="income-total">$0</span>
        </div>
        <div class="form-actions">
          <button class="btn btn-cancel" id="income-cancel">取消</button>
          <button class="btn btn-save" id="income-save">儲存</button>
        </div>
      </div>
      </div>
    </div>

        <div class="field">
          <label>日期</label>
          <input type="date" id="expense-date">
        </div>
        <label style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.5px;">支出項目（可分別輸入金額、備註，並可勾選該項是否為布施）</label>
        <div class="member-amounts" id="expense-item-rows"></div>
        <div class="form-total">
          <span>合計</span>
          <span id="expense-total">$0</span>
        </div>
        <div class="form-actions">
          <button class="btn btn-cancel" id="expense-cancel">取消</button>
          <button class="btn btn-save" id="expense-save">儲存</button>

      </div>
      </div>
    </div>

      </div></div>

  let state = { members: [], records: [] };

  const DEFAULT_MEMBER_AMOUNT = 200;

  function uid(){ return 'r-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }
  function fmt(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  let lastLoadedRaw = null;   // 記錄目前畫面資料的原始字串，用來比對是否有新版本
  let isEditing = false;      // 使用者正在編輯表單時，暫停自動覆蓋畫面
  let editingIds = null;      // 正在「修改」既有紀錄時，記錄被修改的原始紀錄 id（陣列）；新增時為 null

  // 資料儲存在「這支手機、這個瀏覽器」的 localStorage 裡：
  // 不需要網路、不會過期，每次新增/修改後會立刻寫入，下次打開這個網頁時會自動讀出來顯示。
  // 注意：localStorage 是「裝置 + 瀏覽器」綁定的，換一支手機或換一個瀏覽器不會看到同一份資料，
  // 如果用手機瀏覽器的「清除瀏覽資料/清除網站資料」也會把資料一併清掉，請留意。
  function loadFromLocal(){
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw){
        return JSON.parse(raw);
      }
    }catch(e){
      console.error('讀取本機資料失敗', e);
    }
    return null;
  }

  function saveToLocal(raw){
    try{
      window.localStorage.setItem(STORAGE_KEY, raw);
      return true;
    }catch(e){
      console.error('寫入本機資料失敗', e);
      showToast('儲存失敗，手機儲存空間可能不足');
      return false;
    }
  }

  async function load(){
    const existing = loadFromLocal();
    if(existing){
      state = existing;
      lastLoadedRaw = JSON.stringify(existing);
    } else {
      // 第一次在這支手機上打開，帶入預設範例資料，並立刻存進手機
      state = { members: SEED_MEMBERS.slice(), records: SEED_RECORDS.slice() };
      await save();
    }
    if(ensureRecordIds()){
      try{ await save(); }catch(e2){ console.error('save failed', e2); }
    }
    if(fixKnownDateIssue()){
      try{ await save(); }catch(e2){ console.error('save failed', e2); }
    }
    renderAll();
  }

  // 重新從手機本機儲存讀取最新資料並更新畫面（若有變動）。
  // 用於：切回此分頁 / App 回到前景時，確保畫面與最新儲存的資料一致
  // （例如同一支手機開了兩個分頁，其中一個分頁新增了資料）。
  function refreshFromStorage(){
    if(isEditing) return; // 使用者正在填表單時，不要打斷他
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw && raw !== lastLoadedRaw){
      try{
        state = JSON.parse(raw);
        lastLoadedRaw = raw;
        renderAll();
      }catch(e){
        console.error('refresh failed', e);
      }
    }
  }

  // 分頁重新變成可見（切換 App、鎖屏後解鎖、從背景切回）時，立即刷新一次
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      refreshFromStorage();
    }
  });
  // 視窗重新取得焦點時也刷新一次（例如從其他分頁切回）
  window.addEventListener('focus', refreshFromStorage);
  // 同一支手機開多個分頁時，其他分頁存檔會觸發 storage 事件，讓這裡也立刻更新
  window.addEventListener('storage', (e)=>{
    if(e.key === STORAGE_KEY) refreshFromStorage();
  });

  // 一次性資料校正：8/23 那筆昆秦/湘梅/怡珍/濬綾 $1,400 的收入紀錄，日期應為 8/16
  function fixKnownDateIssue(){
    let changed = false;
    state.records.forEach(r=>{
      if(r.date === '2026-08-23' && r.type === 'income' && r.amount === 1400 && r.note && r.note.includes('昆秦')){
        r.date = '2026-08-16';
        changed = true;
      }
    });
    return changed;
  }

  function ensureRecordIds(){
    let changed = false;
    state.records.forEach(r=>{
      if(!r.id){ r.id = uid(); changed = true; }
    });
    return changed;
  }

  async function save(){
    const raw = JSON.stringify(state);
    if(saveToLocal(raw)){
      lastLoadedRaw = raw;
    }
  }

  function computeChron(){
    // stable sort by date ascending, preserving insertion order for ties
    const withIdx = state.records.map((r, i) => ({...r, _i:i}));
    withIdx.sort((a,b)=>{
      if(a.date < b.date) return -1;
      if(a.date > b.date) return 1;
      return a._i - b._i;
    });
    let bal = 0, totalIn = 0, totalOut = 0;
    withIdx.forEach(r=>{
      if(r.type === 'income'){ bal += r.amount; totalIn += r.amount; }
      else { bal -= r.amount; totalOut += r.amount; }
      r._balance = bal;
    });
    return { ordered: withIdx, balance: bal, totalIn, totalOut };
  }

  function renderAll(){
    renderStats();
    renderMembers();
    renderRecords();
    renderIncomeForm();
  }

  function renderStats(){
    const { balance, totalIn, totalOut } = computeChron();
    document.getElementById('stat-income').textContent = fmt(totalIn);
    document.getElementById('stat-expense').textContent = fmt(totalOut);

    const statBalanceEl = document.getElementById('stat-balance');

    if(balance < 0){
      statBalanceEl.textContent = '今日已超額支出';
    } else if(balance === 0){
      statBalanceEl.textContent = '經費為零';
    } else {
      statBalanceEl.textContent = fmt(balance);
    }
  }

  // 依日期分組（支出同日合併），並依日期新到舊排序 → 收支明細清單與收支回報共用
  function buildUnits(){
    const { ordered } = computeChron();
    const expenseGroups = {};
    const units = [];

    ordered.forEach(r=>{
      if(r.type === 'expense'){
        let g = expenseGroups[r.date];
        if(!g){
          g = { type:'expense', date:r.date, ids:[], notes:[], amount:0, balance:0, lastSeq:-1 };
          expenseGroups[r.date] = g;
          units.push(g);
        }
        g.ids.push(r.id);
        if(r.note) g.notes.push(r.note);
        g.amount += r.amount;
        g.balance = r._balance; // 依處理順序覆寫，最終為該日最後一筆的結餘
        g.lastSeq = r._i;
      } else {
        units.push({ type:'income', date:r.date, ids:[r.id], notes: r.note ? [r.note] : [], amount:r.amount, balance:r._balance, lastSeq:r._i });
      }
    });

    // 依日期新到舊排序；同日期時新增/處理順序較晚者排前面
    units.sort((a,b)=>{
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.lastSeq - a.lastSeq;
    });
    return units;
  }

  function renderRecords(){
    const list = document.getElementById('records-list');
    const units = buildUnits();
    if(units.length === 0){
      list.innerHTML = '<div class="empty">還沒有任何紀錄，點選上方按鈕新增第一筆吧</div>';
      return;

    list.innerHTML = units.map(u => {
      const displayNotes = u.type === 'expense' ? [...new Set(u.notes)] : u.notes;

    list.querySelectorAll('.del').forEach(btn=>{

    list.querySelectorAll('.record').forEach((el, idx)=>{

        renderAll();

  // 主畫面「收支回報」：直接回報最新一天的收支明細（與收支明細清單中點選最上面一筆的回報LINE相同）
  function reportLatestToLine(){
    const units = buildUnits();
    if(units.length === 0){
      showToast('目前還沒有任何收支紀錄');
      return;
    }
    openLineReport(units[0], units);
  }

  function openLineReport(u, units){
    const [y, m, d] = u.date.split('-').map(Number);

    // 找出同一天的所有紀錄單位，並依處理順序（lastSeq）排序
    const dayUnits = (units || [u]).filter(x => x.date === u.date).slice().sort((a,b)=> a.lastSeq - b.lastSeq);
    const maxSeq = Math.max(...dayUnits.map(x => x.lastSeq));
    const isLastOfDay = u.lastSeq === maxSeq;

    if(dayUnits.length > 1 && isLastOfDay){
      // 同一天有多筆紀錄，且是當天最後一筆 → 合併顯示當天所有收入、支出、結餘
      const incomeUnits = dayUnits.filter(x => x.type === 'income');
      const expenseUnits = dayUnits.filter(x => x.type === 'expense');
      const incomeText = incomeUnits
        .map(x => (x.notes || []).join('、'))
        .filter(Boolean)
        .join('、');
      const expenseText = expenseUnits
        .map(x => [...new Set(x.notes || [])].join('、'))
        .filter(Boolean)
        .join('、');

      let balanceText;
      if(u.balance < 0) balanceText = '今日已超額支出';
      else if(u.balance === 0) balanceText = '經費為零';
      else balanceText = fmt(u.balance);

      const lines = [`${m}月${d}日茶會收入及支出`];
      if(incomeText){ lines.push('收入：'); lines.push(incomeText); }
      if(expenseText){ lines.push('支出：'); lines.push(expenseText); }
      lines.push(`茶會剩餘金額：${balanceText}`);

      const message = lines.join('\n');
      const url = 'https://line.me/R/msg/text/?' + encodeURIComponent(message);
      window.open(url, '_blank');
      return;
    }

    // 單筆紀錄（或非當天最後一筆）→ 維持原本單筆回報格式
    const dateLabel = `${m}/${d}`;
    const actionWord = u.type === 'income' ? '已收到' : '已支出';
    const notesText = (u.type === 'expense' ? [...new Set(u.notes)] : u.notes).join('、');
    const { balance } = computeChron();
    let balanceText;
    if(balance < 0) balanceText = '今日已超額支出';
    else if(balance === 0) balanceText = '經費為零';
    else balanceText = fmt(balance);
    const message = `${dateLabel}${actionWord}\n${notesText}\n共${fmt(u.amount)}\n目前結餘${balanceText}`;
    const url = 'https://line.me/R/msg/text/?' + encodeURIComponent(message);
    window.open(url, '_blank');
  }

  function cssEscape(s){

  function updateExpenseTotal(){
    const rows = document.querySelectorAll('#expense-item-rows .member-amount-row');
    let total = 0;
    rows.forEach(row=>{
      const amtInput = row.querySelector('.exp-item-amt');
      const donationInput = row.querySelector('.exp-item-donation');
      const amt = Number(amtInput.value) || 0;
      if(!donationInput.checked) total += amt;

    if(totalEl) totalEl.textContent = fmt(total);

  function composeExpenseItems(){
    const rows = document.querySelectorAll('#expense-item-rows .member-amount-row');
    const parts = [];
    const items = [];
    let total = 0;
    rows.forEach(row=>{
      const item = row.querySelector('.exp-item-amt').dataset.item;
      const amt = Number(row.querySelector('.exp-item-amt').value) || 0;
      const note = row.querySelector('.exp-item-note').value.trim();
      const isDonation = row.querySelector('.exp-item-donation').checked;
      if(amt <= 0 && !note) return;

      let label;
      if(item === '其他' && note){
        label = note + (isDonation ? '' : fmt(amt));
      } else {
        label = item + (isDonation ? '' : fmt(amt));
        if(note) label += `（${note}）`;
      }
      parts.push(label);
      items.push({ item, amt, note, donation: isDonation });
      if(!isDonation) total += amt;
    });
    return { parts, total, items };
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 依「、」拆開備註，但括號（）內的「、」不算分隔點，維持原樣不拆
  function splitNoteParts(text){
    const parts = [];
    let depth = 0;
    let current = '';
    for(const ch of text){
      if(ch === '（' || ch === '(') depth++;
      else if(ch === '）' || ch === ')') depth = Math.max(0, depth - 1);
      if(ch === '、' && depth === 0){
        parts.push(current);
        current = '';
      } else {
        current += ch;
      }
    }
    parts.push(current);
    return parts;
  }

  // 判斷是否為中文字（含中文標點），用來判斷是否該換行
  function isChineseChar(ch){
    return /[\u3400-\u9FFF\uF900-\uFAFF]/.test(ch);
  }

  // 在同一段（不含「、」）內，若某個字不是中文、但緊接著下一個字是中文（且不在括號內），
  // 也視為新的一行；括號內（例如「8月-9月」）不受影響，仍維持原樣不拆
  function splitLineBreaks(text){
    const lines = [];
    let depth = 0;
    let current = '';
    let prevChar = '';
    for(const ch of text){
      if(ch === '（' || ch === '(') depth++;
      else if(ch === '）' || ch === ')') depth = Math.max(0, depth - 1);
      if(depth === 0 && current && isChineseChar(ch) && !isChineseChar(prevChar)){
        lines.push(current);
        current = '';
      }
      current += ch;
      prevChar = ch;
    }
    if(current) lines.push(current);
    return lines;
  }

  // 每一段（例如「湘梅$400（8月-9月）」）維持在同一行、不會被硬拆開；
  // 段落與段落之間的「、」只是自然的換行點，空間夠時會排在同一行，
  // 放不下才換到下一行；括號內的「、」不算分隔點，不換行；
  // 另外，若某段最右邊的文字不是「、」、而緊接的下一段文字開頭是中文字，會強制換行
  function noteHtml(text){
    if(!text) return '';
    return splitNoteParts(text).map(part =>
      splitLineBreaks(part).map(seg => `<span class="note-seg">${escapeHtml(seg)}</span>`).join('<br>')
    ).join('、');
  }

  function showFormMessage(formEl, msg){

    msgEl.textContent = msg;

// ── 選單可自由拖曳：按住 📂 拖曳即可移到畫面任何位置，放開後會記住位置 ──
// 靠近上方時往下展開；靠近左邊時標籤改放右側
function initDraggableMenu(cfg) {
  const menu = cfg.menu, main = cfg.main;
  if (!menu || !main) return;
  const M = 8, DRAG_PX = 6;
  const vw = () => document.documentElement.clientWidth || window.innerWidth;
  const vh = () => document.documentElement.clientHeight || window.innerHeight;
  const size = () => menu.offsetWidth || cfg.size;
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
  const limits = () => ({ minX: M, minY: M, maxX: vw() - size() - M, maxY: vh() - size() - M });
  let saved = null, drag = null, justDragged = false;
  try { saved = JSON.parse(localStorage.getItem(cfg.key) || 'null'); } catch (e) {}
  if (saved && !(isFinite(saved.x) && isFinite(saved.y))) saved = null;

  function place(left, top) {
    const L = limits();
    menu.style.right = 'auto'; menu.style.bottom = 'auto';
    menu.style.left = clamp(left, L.minX, L.maxX) + 'px';
    menu.style.top  = clamp(top,  L.minY, L.maxY) + 'px';
  }
  function applySaved() {
    if (!saved) return;
    const L = limits();
    place(L.minX + clamp(saved.x, 0, 1) * (L.maxX - L.minX),
          L.minY + clamp(saved.y, 0, 1) * (L.maxY - L.minY));
  }
  function save() {
    const r = menu.getBoundingClientRect(), L = limits();
    saved = {
      x: L.maxX > L.minX ? (r.left - L.minX) / (L.maxX - L.minX) : 0,
      y: L.maxY > L.minY ? (r.top  - L.minY) / (L.maxY - L.minY) : 0
    };
    try { localStorage.setItem(cfg.key, JSON.stringify(saved)); } catch (e) {}
  }
  // 依目前位置決定：往上／往下展開、標籤放左／放右
  function updateLayout() {
    const r = menu.getBoundingClientRect();
    if (!r.width) return;
    const need = cfg.items * (r.width + 10) + M;
    const above = r.top, below = vh() - r.bottom;
    menu.classList.toggle('fm-down', above < need && below > above);
    const leftRoom = r.left, rightRoom = vw() - r.right;
    menu.classList.toggle('fm-label-right', leftRoom < 112 && rightRoom > leftRoom);
  }

  main.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    const r = menu.getBoundingClientRect();
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: r.left, oy: r.top, moved: false };
    try { main.setPointerCapture(e.pointerId); } catch (_) {}
  });
  main.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < DRAG_PX) return;
      drag.moved = true;
      menu.classList.add('fm-dragging');
      cfg.close();
    }
    place(drag.ox + dx, drag.oy + dy);
    e.preventDefault();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const moved = drag.moved;
    drag = null;
    menu.classList.remove('fm-dragging');
    if (moved) {
      save(); updateLayout();
      justDragged = true;
      setTimeout(() => { justDragged = false; }, 80);
    }
  }
  main.addEventListener('pointerup', endDrag);
  main.addEventListener('pointercancel', endDrag);
  // 拖曳結束時不要當成「點一下」；正常點擊則在展開前先算好方向
  menu.addEventListener('click', e => {
    if (justDragged) { e.stopPropagation(); e.preventDefault(); return; }
    if (main.contains(e.target)) updateLayout();
  }, true);
  window.addEventListener('resize', () => { applySaved(); updateLayout(); });
  applySaved();
  updateLayout();
}
function __startDraggableMenu(cfg) {
  const go = () => initDraggableMenu(cfg);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
}
  __startDraggableMenu({ menu: document.getElementById('home-fab'), main: document.getElementById('home-fab-btn'), key: 'fabPos_茶會', close: () => {}, size: 56, items: 0 });

  // Income / Expense forms now open as their own dedicated screens
  const formIncome = document.getElementById('form-income');
  const formExpense = document.getElementById('form-expense');
  document.getElementById('btn-open-income').addEventListener('click', ()=>{
    editingIds = null;
    document.getElementById('income-screen-title').textContent = '新增收入';
    document.getElementById('income-date').value = todayStr();
    document.getElementById('income-note').value = '';
    document.getElementById('income-other-amount').value = '';
    document.getElementById('income-other-note').value = '';
    renderIncomeForm();
    isEditing = true;
    showScreen('income');
  });
  document.getElementById('income-other-amount').addEventListener('input', updateIncomeTotal);
  document.getElementById('btn-open-expense').addEventListener('click', ()=>{
    editingIds = null;
    document.getElementById('expense-screen-title').textContent = '新增支出';
    document.getElementById('expense-date').value = todayStr();
    renderExpenseForm();
    isEditing = true;
    showScreen('expense');
  });
  document.getElementById('income-cancel').addEventListener('click', ()=>{
    isEditing = false;
    editingIds = null;
    showScreen('home');
  });
  document.getElementById('expense-cancel').addEventListener('click', ()=>{
    isEditing = false;
    editingIds = null;
    showScreen('home');
  });

  // ── 修改既有紀錄：回到「新增收入／新增支出」表單，並帶回原本輸入的金額 ──
  function editUnit(unit){
    isEditing = true;
    editingIds = unit.ids.slice();

    if(unit.type === 'income'){
      const record = state.records.find(r => r.id === unit.ids[0]);
      document.getElementById('income-screen-title').textContent = '修改收入';
      document.getElementById('income-date').value = unit.date;
      renderIncomeForm(); // 先依成員名單重建欄位（含預設金額）

      const wrap = document.getElementById('income-member-rows');
      if(record && record.memberAmounts){
        // 新格式：精確復原每位成員當初輸入的金額與期間
        wrap.querySelectorAll('.amt-input').forEach(inp=>{
          const v = record.memberAmounts[inp.dataset.member];
          inp.value = (v !== undefined && v > 0) ? v : '';
        });
        wrap.querySelectorAll('.period-input').forEach(inp=>{
          const p = (record.memberPeriods && record.memberPeriods[inp.dataset.member]) || '';
          inp.value = p;
        });
        document.getElementById('income-other-amount').value = record.otherAmount > 0 ? record.otherAmount : '';
        document.getElementById('income-other-note').value = record.otherNote || '';
        document.getElementById('income-note').value = record.noteBase || '';
      } else if(record){
        // 舊格式（沒有存細項）：無法拆回每位成員的金額，先把整筆金額與備註放進「其他項目」，方便直接修改
        wrap.querySelectorAll('.amt-input').forEach(inp=>{ inp.value = ''; });
        wrap.querySelectorAll('.period-input').forEach(inp=>{ inp.value = ''; });
        document.getElementById('income-other-amount').value = record.amount > 0 ? record.amount : '';
        document.getElementById('income-other-note').value = record.note || '';
        document.getElementById('income-note').value = '';
      }
      updateIncomeTotal();
      showScreen('income');
    } else {
      // 支出：把這個「收支明細」項目所包含的原始紀錄，還原成支出表單的各項金額
      const itemMap = {};
      EXPENSE_ITEMS.forEach(name => { itemMap[name] = { amt: 0, note: '', donation: false }; });

      unit.ids.forEach(id=>{
        const record = state.records.find(r => r.id === id);
        if(!record) return;
        if(record.items && record.items.length){
          record.items.forEach(it=>{
            const m = itemMap[it.item];
            if(!m) return;
            m.amt += Number(it.amt) || 0;
            if(it.note) m.note = m.note ? (m.note + '、' + it.note) : it.note;
            if(it.donation) m.donation = true;
          });
        } else {
          // 舊格式（沒有存細項）：整筆放進「其他」，方便直接修改
          const m = itemMap['其他'];
          m.amt += Number(record.amount) || 0;
          if(record.note) m.note = m.note ? (m.note + '、' + record.note) : record.note;
        }
      });

      document.getElementById('expense-screen-title').textContent = '修改支出';
      document.getElementById('expense-date').value = unit.date;
      renderExpenseForm();
      document.querySelectorAll('#expense-item-rows .member-amount-row').forEach(row=>{
        const amtInput = row.querySelector('.exp-item-amt');
        const noteInput = row.querySelector('.exp-item-note');
        const donationInput = row.querySelector('.exp-item-donation');
        const m = itemMap[amtInput.dataset.item];
        if(!m) return;
        amtInput.value = m.amt > 0 ? m.amt : '';
        noteInput.value = m.note;
        donationInput.checked = m.donation;
      });
      updateExpenseTotal();
      showScreen('expense');
    }
  }

  document.getElementById('income-save').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      const date = document.getElementById('income-date').value || todayStr();
      const noteBase = document.getElementById('income-note').value.trim();
      const amtInputs = document.querySelectorAll('#income-member-rows .amt-input');
      const parts = [];
      const memberAmounts = {};
      const memberPeriods = {};
      let total = 0;
      amtInputs.forEach(i=>{
        const v = Number(i.value) || 0;
        const member = i.dataset.member;
        const periodInput = document.querySelector(`#income-member-rows .period-input[data-member="${cssEscape(member)}"]`);
        const period = periodInput ? periodInput.value.trim() : '';
        if(v > 0){
          parts.push(member + fmt(v) + (period ? `（${period}）` : ''));
          total += v;
          memberAmounts[member] = v;
        }
        if(period) memberPeriods[member] = period;
      });
      const otherAmount = Number(document.getElementById('income-other-amount').value) || 0;
      const otherNote = document.getElementById('income-other-note').value.trim();
      if(otherAmount > 0 || otherNote){
        parts.push('其他' + fmt(otherAmount) + (otherNote ? `（${otherNote}）` : ''));
        total += otherAmount;
      }
      if(total <= 0 && !noteBase){
        showFormMessage(formIncome, '請至少輸入一位成員的金額，或填寫備註');
        return;
      }
      const note = [parts.join('、'), noteBase].filter(Boolean).join(' － ');
      if(editingIds){
        state.records = state.records.filter(r => !editingIds.includes(r.id));
      }
      state.records.push({
        id: uid(), date, type:'income', amount: total, note,
        memberAmounts, memberPeriods, otherAmount, otherNote, noteBase
      });
      await save();
      document.getElementById('income-note').value = '';
      document.getElementById('income-other-amount').value = '';
      document.getElementById('income-other-note').value = '';
      isEditing = false;
      editingIds = null;
      document.getElementById('income-screen-title').textContent = '新增收入';
      renderAll();
      showScreen('home');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('expense-save').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      const date = document.getElementById('expense-date').value || todayStr();
      const { parts, total, items } = composeExpenseItems();
      if(parts.length === 0){
        showFormMessage(formExpense, '請至少輸入一個支出項目的金額或備註');
        return;
      }
      const note = parts.join('、');
      if(editingIds){
        state.records = state.records.filter(r => !editingIds.includes(r.id));
      }
      state.records.push({ id: uid(), date, type:'expense', amount: total, note, items });
      await save();
      isEditing = false;
      editingIds = null;
      document.getElementById('expense-screen-title').textContent = '新增支出';
      renderAll();
      showScreen('home');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('add-member-btn').addEventListener('click', async ()=>{
    const inp = document.getElementById('new-member-name');
    const name = inp.value.trim();
    if(!name) return;
    if(state.members.includes(name)){ inp.value=''; return; }
    state.members.push(name);
    inp.value = '';
    await save();
    renderMembers();
    renderIncomeForm();
  });
  document.getElementById('new-member-name').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('add-member-btn').click();
  });

  function exportExcel(){
    if(typeof XLSX === 'undefined'){
      showToast('匯出功能載入中，請稍後再試一次');
      return;
    }
    const { ordered, balance, totalIn, totalOut } = computeChron();

    // 帳本紀錄工作表
    const recordRows = ordered.map(r => ({
      '日期': r.date,
      '類型': r.type === 'income' ? '收入' : '支出',
      '金額': r.type === 'income' ? r.amount : -r.amount,
      '備註': r.note || '',
      '結餘': r._balance
    }));
    const wsRecords = XLSX.utils.json_to_sheet(recordRows);
    wsRecords['!cols'] = [{wch:12},{wch:8},{wch:10},{wch:50},{wch:10}];

    // 摘要工作表
    const summaryRows = [
      { '項目':'目前結餘', '金額': balance },
      { '項目':'累計收入', '金額': totalIn },
      { '項目':'累計支出', '金額': totalOut },
      { '項目':'匯出時間', '金額': new Date().toLocaleString('zh-TW') }
    ];
    const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
    wsSummary['!cols'] = [{wch:14},{wch:20}];

    // 成員名單工作表
    const memberRows = state.members.length
      ? state.members.map(name => ({ '成員姓名': name }))
      : [{ '成員姓名': '（尚無成員）' }];
    const wsMembers = XLSX.utils.json_to_sheet(memberRows);
    wsMembers['!cols'] = [{wch:14}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsSummary, '摘要');
    XLSX.utils.book_append_sheet(wb, wsRecords, '帳本紀錄');
    XLSX.utils.book_append_sheet(wb, wsMembers, '成員名單');

    const filename = '茶會帳本_' + todayStr() + '.xlsx';
    XLSX.writeFile(wb, filename);
  }

  document.getElementById('btn-export-excel').addEventListener('click', exportExcel);
  document.getElementById('btn-line-report').addEventListener('click', reportLatestToLine);

  // ---- JSON 備份匯出/匯入（防止手機儲存空間被清掉時資料遺失）----
  function backupJSON(){
    try{
      const raw = JSON.stringify(state, null, 2);
      const blob = new Blob([raw], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '茶會帳本備份_' + todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 1000);
      showToast('已匯出備份檔，請妥善保存');
    }catch(e){
      console.error('backup failed', e);
      showToast('匯出備份失敗');
    }
  }
  document.getElementById('btn-backup-json').addEventListener('click', backupJSON);

  document.getElementById('btn-restore-json').addEventListener('click', ()=>{
    document.getElementById('restore-file-input').click();
  });
  document.getElementById('restore-file-input').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // 允許重複選同一個檔案
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || !Array.isArray(data.members) || !Array.isArray(data.records)){
        showToast('備份檔格式不正確');
        return;
      }
      if(!confirm('匯入後會覆蓋目前手機上的資料，確定要匯入這份備份嗎？')){
        return;
      }
      state = data;
      ensureRecordIds();
      await save();
      renderAll();
      showToast('備份已匯入');
    }catch(err){
      console.error('restore failed', err);
      showToast('匯入失敗，檔案可能已損毀');
    }
  });

  load();
})();

<script>
(function(){
  function showTip(msg, color){
    var tip = document.createElement('div');
    tip.textContent = msg;
    tip.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);background:' + (color||'#1565c0') + ';color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:999999;box-shadow:0 2px 12px rgba(0,0,0,.3);font-family:"Noto Sans TC",sans-serif;max-width:90vw;text-align:center;';
    document.body.appendChild(tip);
    return tip;
  }
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('autobackup') === '1') {
      window.addEventListener('load', function(){
        setTimeout(function(){
          try {
            var btn = document.getElementById('btn-backup-json');
            if (!btn) throw new Error('找不到備份按鈕，可能頁面結構有變');
            btn.click();
            showTip('已自動完成備份下載，這個分頁會自動關閉');
            setTimeout(function(){ try { window.close(); } catch(e) {} }, 2200);
          } catch(err) {
            alert('自動備份失敗，請手動點擊頁面上的「匯出備份」按鈕。\n' + (err && err.message ? err.message : err));
          }
        }, 1200);
      });
    }
    if (qs.get('autorestore') === '1') {
      window.addEventListener('load', function(){
        setTimeout(function(){
          try {
            showTip('請選擇備份檔進行恢復，完成後可自行關閉此分頁', '#0f6e3a');
            var btn = document.getElementById('btn-restore-json');
            if (!btn) throw new Error('找不到恢復按鈕，可能頁面結構有變');
            btn.click();
          } catch(err) {
            alert('自動開啟恢復失敗，請手動點擊頁面上的「匯入備份」按鈕。\n' + (err && err.message ? err.message : err));
          }
        }, 1200);
      });
    }
  } catch(e) {}
})();
